name: Deploy Backend

on:
  push:
    branches: [feature/ci-cd, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Login to ghcr.io
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove old container
            docker stop vtos-backend 2>/dev/null || true
            docker rm vtos-backend 2>/dev/null || true

            # Run new container
            docker run -d \
              --name vtos-backend \
              --network vtos-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e DatabaseProvider=PostgreSQL \
              -e JwtSettings__Secret="${{ secrets.JWT_SECRET }}" \
              -e EmailSettings__Username="${{ secrets.EMAIL_USERNAME }}" \
              -e EmailSettings__Password="${{ secrets.EMAIL_PASSWORD }}" \
              -e CorsSettings__AllowedOrigins__0="${{ secrets.FRONTEND_URL }}" \
              -e FrontendSettings__BaseUrl="${{ secrets.FRONTEND_URL }}" \
              -e TryOnSettings__ApiKey="${{ secrets.TRYON_API_KEY }}" \
              -e ImageStorage__ImgBB__ApiKey="${{ secrets.IMGBB_API_KEY }}" \
              -e PayOSSettings__ClientId="${{ secrets.PAYOS_CLIENT_ID }}" \
              -e PayOSSettings__ApiKey="${{ secrets.PAYOS_API_KEY }}" \
              -e PayOSSettings__ChecksumKey="${{ secrets.PAYOS_CHECKSUM_KEY }}" \
              -e PayOSSettings__PayoutClientId="${{ secrets.PAYOS_PAYOUT_CLIENT_ID }}" \
              -e PayOSSettings__PayoutApiKey="${{ secrets.PAYOS_PAYOUT_API_KEY }}" \
              -e PayOSSettings__PayoutChecksumKey="${{ secrets.PAYOS_PAYOUT_CHECKSUM_KEY }}" \
              -e PaymentSettings__ReturnBaseUrl="${{ secrets.FRONTEND_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Clean up old images
            docker image prune -f
