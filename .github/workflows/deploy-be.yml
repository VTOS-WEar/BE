name: Deploy Backend

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME_LC
          script: |
            # Login to ghcr.io on VPS
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ${REGISTRY}/${IMAGE_NAME_LC}:latest

            # Stop and remove old container
            docker stop vtos-backend 2>/dev/null || true
            docker rm vtos-backend 2>/dev/null || true

            # Run new container using .env file on VPS
            docker run -d \
              --name vtos-backend \
              --network vtos-network \
              --restart unless-stopped \
              --env-file /root/vtos/.env \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e DatabaseProvider=PostgreSQL \
              -e "ConnectionStrings__DefaultConnection=Host=vtos-postgres;Port=5432;Database=vtosdb;Username=vtos;Password=$(grep DB_PASSWORD /root/vtos/.env | cut -d= -f2)" \
              -e "ImageStorage__Minio__Endpoint=$(grep MINIO_ENDPOINT /root/vtos/.env | cut -d= -f2)" \
              -e "ImageStorage__Minio__AccessKey=$(grep MINIO_ACCESS_KEY /root/vtos/.env | cut -d= -f2)" \
              -e "ImageStorage__Minio__SecretKey=$(grep MINIO_SECRET_KEY /root/vtos/.env | cut -d= -f2)" \
              -e "ImageStorage__Minio__BucketName=$(grep MINIO_BUCKET /root/vtos/.env | cut -d= -f2)" \
              -e "ImageStorage__Minio__PublicBaseUrl=$(grep MINIO_PUBLIC_URL /root/vtos/.env | cut -d= -f2)" \
              -e "GeminiTryOn__ApiKey=$(grep GEMINI_TRYON_API_KEY /root/vtos/.env | cut -d= -f2)" \
              -p 8080:8080 \
              ${REGISTRY}/${IMAGE_NAME_LC}:latest

            # Clean up old images
            docker image prune -f
